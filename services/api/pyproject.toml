[project]
name = "equitymux-api"
version = "0.1.0"
description = "EquityMux — intent and execution router for tokenized stocks (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.28",
    "structlog>=24.4",
]

[dependency-groups]
# Installed by default on `uv sync`; skipped in images via `uv pip install .`
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Intentional patterns:
#   BLE001 — broad except around best-effort probes (health, enrichment) is
#            deliberate: a provider fault must never 500 the status surface.
#   S110   — try/except/pass used for optional state transitions.
#   SIM102 — nested ifs kept for readability of rule evaluation.
#   UP031  — printf-style in a CLI summary script.
#   PLW1510 — subprocess.run reads returncode deliberately (wallet CLI).
ignore = ["BLE001", "S110", "SIM102", "UP031", "PLW1510"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
