name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install deps
        run: uv sync --frozen || uv sync
      - name: Lint
        run: uv run ruff check equitymux tests
      - name: Type check
        run: uv run mypy -p equitymux --no-incremental
      - name: Tests
        run: uv run pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test
        run: forge test
        working-directory: packages/contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter @equitymux/web typecheck
      - name: Unit tests
        run: pnpm --filter @equitymux/web test
      - name: Build
        run: pnpm --filter @equitymux/web build
        env:
          EQUITYMUX_API: http://localhost:8000

  keeper-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/keeper/agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (standalone package)
        run: pnpm install   # agent/pnpm-workspace.yaml makes this dir self-contained
      - name: Compile
        run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private keys / mnemonics committed
        run: |
          ! grep -rInE -e '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' --exclude-dir=.git --exclude-dir=node_modules . || exit 1
          ! grep -rInE '\b0x[0-9a-fA-F]{64}\b' --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sol' --include='*.env*' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib --exclude-dir=out . \
            | grep -v '.env.example' | grep -vE '0x[0]{64}|gitleaks:allow' || exit 1
